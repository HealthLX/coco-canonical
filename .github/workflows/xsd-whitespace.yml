name: XSD Whitespace Check
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  whitespace_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: editorconfig-checker/action-editorconfig-checker@v2
        with:
          # Limit to .xsd files
          pattern: "**/*.xsd"