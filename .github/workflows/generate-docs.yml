name: Generate and Publish Documentation

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      schema_name:
        description: 'Schema name to process (leave empty for all schemas)'
        required: false
        type: choice
        options:
          - ''
          - 'Clinical'
          - 'Core-Model'
          - 'EOB'
          - 'Formulary'
          - 'Provider-Directory'
          - 'Roster'

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || 'manual' }}
      SCHEMA_NAME: ${{ inputs.schema_name }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate Markdown from XSD
      run: |
        mkdir -p docs docs/release_docs
        if [ -z "$SCHEMA_NAME" ]; then
          # Process all schemas
          echo "Processing all schemas in schemas/v10.0/"
          python tools/build_xsd_docs.py v10.0 --release-tag $RELEASE_TAG
        else
          # Process specific schema
          echo "Processing schema: $SCHEMA_NAME"
          python tools/xsd_to_md.py \
            schemas/v10.0/${SCHEMA_NAME}.xsd \
            docs/${SCHEMA_NAME}_Guide.md \
            $RELEASE_TAG
        fi
        # Copy generated docs to release_docs folder
        cp docs/*_Guide.md docs/release_docs/ 2>/dev/null || true

    - name: Commit and push docs to repo
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        # Ensure we're on the correct branch and it's up to date
        if [ "${{ github.event_name }}" = "release" ]; then
          BRANCH="main"
          git fetch origin main
          git checkout main
          git reset --hard origin/main
        else
          BRANCH="${{ github.ref_name }}"
          git fetch origin $BRANCH
          git checkout $BRANCH
          git reset --hard origin/$BRANCH
        fi
        
        # ONLY add release_docs files - nothing else
        git add docs/release_docs/*.md
        
        # Verify we're only committing docs/release_docs files
        STAGED_FILES=$(git diff --staged --name-only)
        if [ -z "$STAGED_FILES" ]; then
          echo "No changes to commit"
        else
          # Double-check: ensure all staged files are in docs/release_docs
          for file in $STAGED_FILES; do
            if [[ ! "$file" =~ ^docs/release_docs/.*\.md$ ]]; then
              echo "ERROR: Attempted to commit file outside docs/release_docs: $file"
              git reset
              exit 1
            fi
          done
          
          COMMIT_MSG="Update release documentation from $RELEASE_TAG"
          if [ "$SCHEMA_NAME" != "" ]; then
            COMMIT_MSG="Update $SCHEMA_NAME release documentation from $RELEASE_TAG"
          fi
          git commit -m "$COMMIT_MSG"
          git push origin HEAD:$BRANCH
          echo "Successfully pushed documentation to $BRANCH branch"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Markdown to release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event.release.tag_name }}
        files: docs/*.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

